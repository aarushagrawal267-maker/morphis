name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: morphis
          POSTGRES_DB: morphis
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:morphis@127.0.0.1:5432/morphis
      TEST_DATABASE_URL: postgresql://postgres:morphis@127.0.0.1:5432/morphis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck # also generates the Prisma client
      - run: npm run lint
      - run: npm run db:push
      - run: npm test
      - run: npm run build

  e2e:
    name: Playwright browser tests
    # slow under software WebGL (about 15 minutes), so run it on demand and on pull requests
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
